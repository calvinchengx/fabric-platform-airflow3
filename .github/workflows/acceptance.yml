# Does a PUBLISHED fabric-emulator still carry this platform end to end?
#
# CI proves what this repository owns; this proves what it CONSUMES. The
# emulator ships on its own cadence, and until now nothing here noticed a
# release at all: the pin moved when somebody remembered, and
# `fabric-platform-notebook-pipelines` was the only Fabric platform the
# emulator's release told anything.
name: Acceptance

on:
  # Fired by fabric-emulator's release workflow.
  repository_dispatch:
    types: [fabric-emulator-release]
  # THE GUARD, and it is not belt-and-braces. A dispatch that silently fails to
  # fire (revoked token, renamed event type, a workflow auto-disabled after 60
  # days of inactivity) is indistinguishable from one that fired and passed.
  # The schedule makes that absence loud within a day.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the released emulator end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fabric-platform-airflow3
    # To push the adopted pin back. The repository default is read-only and a
    # job that only reads should stay that way; this one does not.
    permissions:
      contents: write
    steps:
      # Full history and a usable token: the default checkout is a depth-1
      # detached HEAD, which cannot rebase onto a main that moved during the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: fabric-platform-airflow3
      # THE VENDORS. `make sources` reads `sources.yaml` from a sources repo and
      # generates the compose fragment; without this checkout it exits naming the
      # missing file rather than starting a stack with no vendors.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calvinchengx/contoso-sources
          path: contoso-sources
      # THE PRODUCT. This platform carries none: PRODUCT is a path, and the
      # Makefile contains no product identifier by design.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calvinchengx/contoso-data-product-fabric-airflow3
          path: contoso-data-product-fabric-airflow3
      # THE FAMILY'S FIGURES, from the repository that owns them. Not the
      # product and not a dependency of this platform: the last step of this
      # job runs one script out of this checkout to hold the run's snapshot to
      # the numbers every cell must produce.
      #
      # PINNED BY SHA, not tracking main. Core's own rules say a release is the
      # unit of change and nothing tracks main, and a nightly whose expectations
      # can move without a reviewed commit here is a nightly that can be turned
      # green by editing another repository. A SHA is also what this workflow
      # already does for every third-party action. Move it deliberately, and
      # only when the family's numbers move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calvinchengx/contoso-data-product
          ref: 2cf7bae8a1e1f4a8cddd2cd5510d435e16febb3b
          path: contoso-data-product
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
      # VERIFY THE RELEASE THAT FIRED, not the pin in the checkout. A dispatch
      # for 0.33.0 that ran against the 0.32.0 in versions.env would report
      # success, in the emulator's own release history, for a release nobody
      # tested.
      #
      # `set_release.py` moves the DIGESTS too, which is the part that matters
      # here: measured on v0.29.0, all three digests moved while two of the three
      # tags stayed exactly where they were. A version-only bump would run a new
      # emulator against the previous release's Sail and statement agent.
      #
      # Only on dispatch. The schedule verifies the existing pin, which is the
      # other thing worth knowing: does the version we claim to support still
      # work today?
      # WHICH VERSION THIS RUN IS ABOUT.
      #
      # On a dispatch it is the release that fired. On the schedule it is the
      # NEWEST release, resolved here rather than assumed to be the pin.
      #
      # THAT IS WHAT MAKES THE DISPATCH OPTIONAL. A cross-repository dispatch
      # needs a token with write on every platform, and when that token expires
      # or is under-scoped the platforms go quiet with nothing to say so. Polling
      # costs a day of latency and no secret at all, so the dispatch is now an
      # optimisation for immediacy rather than the only way this runs.
      #
      # When the platform is already current, `latest` equals the pin and this
      # behaves exactly as the schedule did before: it answers "does the version
      # we claim to support still work today?".
      - name: Resolve the version to verify
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_CLIENT_PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            version="${GITHUB_EVENT_CLIENT_PAYLOAD_VERSION}"
            echo "dispatched for $version"
          else
            version=$(gh release view --repo calvinchengx/fabric-emulator \
                        --json tagName -q .tagName | sed 's/^v//')
            echo "newest release is $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Point at that version
        run: |
          python3 scripts/set_release.py "${{ steps.target.outputs.version }}"
          git --no-pager diff --stat versions.env
      # THE BYTES, not just the declaration checked out above. Without this the
      # vendors' fixtures -- the exports and the .api-key each one enforces --
      # do not exist, and mokapi does not fail on that: it generates bodies from
      # the schema and answers every request 200. This workflow had never run
      # the step, which the vendor healthcheck now catches at `make up` rather
      # than letting a medallion build on invented rows. The third platform
      # this week to need exactly this line.
      - name: Materialise the vendor exports
        run: make sources
        working-directory: contoso-sources
      - run: make up PRODUCT=../contoso-data-product-fabric-airflow3 SOURCES=../contoso-sources
      # VERIFY_TIMEOUT SITS INSIDE timeout-minutes, on purpose. The default is
      # 3600s against a 45-minute job, so a wedged run was cancelled by GitHub
      # before verify could print which task it was waiting on -- the first
      # adoption run ended exactly that way, with no verdict and no diagnosis.
      # A settled stack finishes this DAG in seven to fifteen minutes; 1800s
      # is twice the worst of those and still leaves the job time to say why.
      - run: make verify DAG=contoso_daily VERIFY_TIMEOUT=1800 PRODUCT=../contoso-data-product-fabric-airflow3 SOURCES=../contoso-sources
      # BRING THE NUMBERS OUT OF THE WORKER. The DAG's `publish` task writes
      # them inside the container; without this step nothing outside can read
      # them, which is why this cell had no unattended figure at all.
      - run: make snapshot PRODUCT=../contoso-data-product-fabric-airflow3 SOURCES=../contoso-sources
      # THE NUMBERS, not merely the run (G50). Everything above proves the DAG
      # ran green; this is the only step that can fail because gold returned
      # different money.
      #
      # No `if: always()`. A failed DAG has no numbers worth checking, and a
      # missing snapshot after a SUCCESSFUL run is a finding the script reports
      # as one rather than skipping.
      - name: Assert the figures core publishes
        run: |
          python3 ../contoso-data-product/scripts/assert_snapshot.py \
            --label fabric-platform-airflow3 \
            product_snapshot.json
      # ADOPT WHAT THIS RUN JUST PROVED. Everything above ran against the
      # dispatched version, so by here the pin has been verified end to end and
      # is sitting uncommitted in the working tree. Discarding it and asking a
      # human to retype it is the only thing between a verified release and an
      # adopted one.
      #
      # No `if: always()`. A step with no condition runs only when every step
      # before it passed, which is exactly the gate wanted: a red run leaves the
      # pin where it is.
      # ADOPT WHENEVER THE PIN MOVED, not only on a dispatch. A scheduled run
      # that verified a newer release end to end has proved exactly what a
      # dispatched one proves, and throwing that away would mean the pin only
      # ever advances when a cross-repository token happens to be working.
      - name: Adopt the version this run just verified
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet versions.env; then
            echo "already pinned at $VERSION; nothing to adopt"
            exit 0
          fi
          git commit -qm "pin $VERSION, adopted by the acceptance run that verified it" versions.env
          # main can move during the run; without the rebase the push races and
          # the release looks broken for a reason unrelated to the release.
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          echo "adopted $VERSION" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: make down
